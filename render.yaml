services:
  - type: web
    name: kasir-app
    runtime: php
    buildCommand: composer install --optimize-autoloader --no-dev && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: kasir-db
          property: connectionString

databases:
  - name: kasir-db
    databaseName: kasir
    user: kasir_user